# =============================================================================
# perfpilot-mcp-perfmemory — standalone spin-up
#
# Usage (from this folder):
#   cp .env.example .env    # then fill in embedding + Postgres creds
#   docker compose up --build -d
#
# Standalone note: this file does NOT start the pgvector database. Bring
# up docker/postgresql first (or point POSTGRES_HOST at an external
# instance) before starting perfmemory. Full-stack wiring lands in
# Phase 1e.
# =============================================================================

services:
  perfpilot-mcp-perfmemory:
    build:
      context: ../..
      dockerfile: docker/perfmemory-mcp/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-mcp-perfmemory:latest
    container_name: perfpilot-mcp-perfmemory
    env_file:
      - path: .env
        required: false
    ports:
      - "8116:8116"
    volumes:
      - ../../mcp-perf-suite/artifacts:/app/artifacts
    restart: unless-stopped
