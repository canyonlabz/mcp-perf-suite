server:
  name: "perfpilot-mcp-gateway"
  transport: "http"
  host: "0.0.0.0"
  port: 8125

# Default remote MCP endpoints for the Docker compose network.
# Environment variables MCP_URL_<NAME> override these values.
mcp_urls:
  jmeter:       "http://perfpilot-mcp-jmeter:8112/perfpilot-mcp-jmeter/mcp"
  blazemeter:   "http://perfpilot-mcp-blazemeter:8110/perfpilot-mcp-blazemeter/mcp"
  datadog:      "http://perfpilot-mcp-datadog:8111/perfpilot-mcp-datadog/mcp"
  perfanalysis: "http://perfpilot-mcp-perfanalysis:8113/perfpilot-mcp-perfanalysis/mcp"
  perfreport:   "http://perfpilot-mcp-perfreport:8114/perfpilot-mcp-perfreport/mcp"
  confluence:   "http://perfpilot-mcp-confluence:8115/perfpilot-mcp-confluence/mcp"
  perfmemory:   "http://perfpilot-mcp-perfmemory:8116/perfpilot-mcp-perfmemory/mcp"
  github:       "http://perfpilot-mcp-github:8118/perfpilot-mcp-github/mcp"
